name: LinkedIn Auto-Publisher

on:
  # 1. Webhook externo (cron-job.org / EasyCron llama a este endpoint)
  repository_dispatch:
    types: [publish-linkedin]

  # 2. Cron de respaldo — cada 15 min lun-vie 8am-20pm Chile (= 11:00-23:00 UTC)
  schedule:
    - cron: '*/15 11-23 * * 1-5'

  # 3. Botón manual desde GitHub Actions
  workflow_dispatch:

  # 4. Al actualizar posts.json
  push:
    paths:
      - 'data/posts.json'

env:
  TZ: America/Santiago

permissions:
  contents: write

concurrency:
  group: linkedin-auto-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # No correr si el commit fue del bot (evita loop con push trigger)
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip ci]')
    
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci --omit=dev 2>/dev/null || npm install --omit=dev

      - name: Validate required secret
        run: |
          if [ -z "${{ secrets.LINKEDIN_CONFIG }}" ]; then
            echo "❌ Falta el secret LINKEDIN_CONFIG (base64 de config.json)"
            exit 1
          fi

      - name: Restore config
        run: echo "${{ secrets.LINKEDIN_CONFIG }}" | base64 -d > config.json

      - name: Pull latest state
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Run publisher
        run: node src/publish.js

      - name: Commit and push updated posts status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/posts.json
          git add data/publish-log.txt 2>/dev/null || true
          if ! git diff --staged --quiet; then
            git commit -m "🤖 Auto-publish: actualizar estado de posts [skip ci]"
            for i in 1 2 3; do
              git pull --rebase origin main && git push && break
              echo "Retry $i..."
              sleep 5
            done
          fi
