name: LinkedIn Auto-Publisher

on:
  schedule:
    # Corre cada 10 minutos, lunes a sábado (UTC). El script evalúa hora Chile.
    - cron: '*/10 * * * 1-6'
  workflow_dispatch: # Permite ejecutar manualmente desde GitHub

env:
  TZ: America/Santiago

permissions:
  contents: write

concurrency:
  group: linkedin-auto-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci --omit=dev 2>/dev/null || npm install --omit=dev

      - name: Validate required secret
        run: |
          if [ -z "${{ secrets.LINKEDIN_CONFIG }}" ]; then
            echo "❌ Falta el secret LINKEDIN_CONFIG (base64 de config.json)"
            exit 1
          fi

      - name: Restore config
        run: echo "${{ secrets.LINKEDIN_CONFIG }}" | base64 -d > config.json

      - name: Pull latest state
        run: |
          git pull --rebase origin main || true

      - name: Run publisher
        run: node src/publish.js

      - name: Commit updated posts status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/posts.json
          git add data/publish-log.txt 2>/dev/null || true
          git diff --staged --quiet || git commit -m "🤖 Auto-publish: actualizar estado de posts [skip ci]"
          git push
